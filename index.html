<script>
'use strict';
const PLAN=JSON.parse(document.getElementById('planData').textContent),KEY='body-beast-local-v1',app=document.getElementById('app');
const defaults=()=>({version:1,start:'',week:1,sessions:{},metrics:{}});let state=defaults(),page='plan',selected=null,storageOK=true,loadBlocked=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statuses=['รอทำ','ทำแล้ว','พัก','ข้าม'];
function validDate(v){return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v+'T12:00:00').getTime())&&new Date(v+'T12:00:00').getDate()===Number(v.slice(8,10))&&new Date(v+'T12:00:00').getFullYear()>=2000&&new Date(v+'T12:00:00').getFullYear()<=2100}
function cleanImport(x){
 if(!x||x.version!==1||typeof x.sessions!=='object'||!x.sessions||Array.isArray(x.sessions)||typeof x.metrics!=='object'||!x.metrics||Array.isArray(x.metrics))throw Error('รูปแบบไฟล์ไม่ถูกต้อง');
 if(x.start!==''&&(!validDate(x.start)||new Date(x.start+'T12:00:00').getDay()!==1))throw Error('วันที่เริ่มต้องเป็นวันจันทร์');
 let out=defaults();out.start=x.start;out.week=Number.isInteger(x.week)&&x.week>=1&&x.week<=13?x.week:1;
 const str=(v,max=2000)=>typeof v==='string'?v.slice(0,max):typeof v==='number'&&Number.isFinite(v)?String(v):'';
 for(const s of PLAN){const a=x.sessions[s.id];if(!a||typeof a!=='object')continue;let r={status:statuses.includes(a.status)?a.status:'รอทำ',note:str(a.note),sets:{}};for(const k of ['minutes','distance','hr','rpe','activity'])r[k]=str(a[k],100);for(const set of s.sets){let b=a.sets?.[set.id];if(b&&typeof b==='object')r.sets[set.id]={kg:str(b.kg,20),actual:str(b.actual,100),target:str(b.target,100),done:b.done===true};}out.sessions[s.id]=r;}
 for(let w=1;w<=13;w++){const a=x.metrics[w];if(a&&typeof a==='object'){out.metrics[w]={};for(const k of ['weight','waist','pullup','note'])out.metrics[w][k]=str(a[k]);}}
 return out;
}
try{const raw=localStorage.getItem(KEY);if(raw){state=cleanImport(JSON.parse(raw));}localStorage.setItem(KEY+'.test','1');localStorage.removeItem(KEY+'.test');}catch(e){storageOK=false;loadBlocked=true;document.getElementById('storageAlert').innerHTML='<div class="banner danger">อ่านหรือบันทึกข้อมูลเดิมไม่ได้ ขณะนี้ใช้ได้ชั่วคราวในหน้านี้ กรุณาส่งออกข้อมูลสำรองก่อนปิดหน้า และเปิดผ่านเบราว์เซอร์ปกติหรือ localhost</div>';}
function save(){if(loadBlocked)return false;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;const el=document.getElementById('saveLabel');if(el)el.textContent='บันทึกแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});return true;}catch{storageOK=false;document.getElementById('storageAlert').innerHTML='<div class="banner danger">บันทึกในเบราว์เซอร์ไม่สำเร็จ กรุณาส่งออกไฟล์สำรองก่อนปิดหน้า</div>';return false;}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4000)}
function record(s){return state.sessions[s.id]||(state.sessions[s.id]={status:s.kind==='พัก'?'พัก':'รอทำ',note:'',sets:{}})}
function read(s){return state.sessions[s.id]||{status:s.kind==='พัก'?'พัก':'รอทำ',sets:{}}}
function dateFor(s){if(!state.start)return '';const d=new Date(state.start+'T12:00:00');d.setDate(d.getDate()+s.offset);return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}
const block=w=>w<=3?'Build':w<=9?'Bulk':'Beast';
function opts(values,value){return values.map(v=>`<option ${v===value?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}
function field(label,key,value,type='number',extra=''){return `<label>${label}<input data-field="${key}" type="${type}" value="${esc(value)}" ${type==='number'?`min="${key==='rpe'?1:0}" step="any" inputmode="decimal" enterkeyhint="done"`:''} ${extra}></label>`}
function heading(title,sub=''){return `<div class="top"><div><div class="eyebrow">BODY BEAST / ${esc(sub)}</div><h1>${title}</h1></div><span class="save" id="saveLabel">${storageOK?'บันทึกอัตโนมัติในเครื่อง':'โหมดชั่วคราว • ส่งออกก่อนปิด'}</span></div>`}
function weekControls(){return `<div class="weekcontrols"><button id="prevWeek" aria-label="สัปดาห์ก่อน" ${state.week===1?'disabled':''}>‹</button><select id="weekSelect" aria-label="เลือกสัปดาห์">${Array.from({length:13},(_,i)=>`<option value="${i+1}" ${state.week===i+1?'selected':''}>สัปดาห์ ${i+1}</option>`).join('')}</select><button id="nextWeek" aria-label="สัปดาห์ถัดไป" ${state.week===13?'disabled':''}>›</button></div>`}
function render(){document.body.classList.toggle('session-open',page==='plan'&&Boolean(selected));document.querySelectorAll('nav button').forEach(b=>{const active=b.dataset.page===page;b.classList.toggle('active',active);active?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');});if(page==='plan')selected?renderSession():renderPlan();else if(page==='progress')renderProgress();else renderSettings();}
function renderPlan(){const all=PLAN.filter(s=>s.kind==='เวท'),complete=all.filter(s=>read(s).status==='ทำแล้ว').length,week=PLAN.filter(s=>s.week===state.week),done=week.filter(s=>s.kind==='เวท'&&read(s).status==='ทำแล้ว').length,cardio=week.filter(s=>s.kind.startsWith('Cardio')).reduce((n,s)=>n+(Number(read(s).minutes)||0),0);
 app.innerHTML=heading('ตารางฝึกของคุณ','4 DAYS / 13 WEEKS')+(!state.start?'<div class="banner">เริ่มด้วยการเลือกวันจันทร์ใน <button class="ghost" data-page="settings">ตั้งค่า</button> หรือเลือกบันทึกตามสัปดาห์ได้ทันที</div>':'')+`<div class="stats"><div class="stat"><span class="muted">เวทสัปดาห์นี้</span><strong>${done}<span class="muted"> / 4</span></strong><div class="progress"><div style="width:${done*25}%"></div></div></div><div class="stat"><span class="muted">Cardio สัปดาห์นี้</span><strong>${cardio}<span class="muted"> นาที</span></strong><span class="muted">ตามเวลาที่บันทึก</span></div><div class="stat"><span class="muted">ตลอดโปรแกรม</span><strong>${complete}<span class="muted"> / 52</span></strong><div class="progress"><div style="width:${complete/52*100}%"></div></div></div></div><div class="weekhead"><div><h2>สัปดาห์ ${state.week} <span style="color:var(--lime)">/ ${block(state.week)}</span></h2><p class="muted">${state.week<=3?'เรียนรู้ท่าและเลือกน้ำหนักที่ควบคุมได้':state.week<=9?'แยกกล้ามเนื้อ • แขนเสริมท้ายวันเสาร์':'สลับ Build และ Bulk ตามตาราง'}</p></div>${weekControls()}</div><div class="grid">${week.map(s=>`<button class="day ${s.kind==='พัก'?'rest':''}" data-session="${s.id}"><div class="date">${s.day}<strong>${dateFor(s)||'—'}</strong></div><div class="body"><span class="badge ${read(s).status==='ทำแล้ว'?'done':s.kind.startsWith('Cardio')?'cardio':''}">${read(s).status==='รอทำ'?esc(s.kind):esc(read(s).status)}</span><h3>${esc(s.workout)}</h3><p class="muted">${esc(s.time)}${s.kind==='เวท'?' · '+s.sets.length+' รายการเซ็ต':''}</p></div><span class="chev" aria-hidden="true">›</span></button>`).join('')}</div>`;
}
function renderSession(){const s=PLAN.find(x=>x.id===selected),r=read(s);app.innerHTML=`<button class="back ghost" id="back">‹ ตารางสัปดาห์ ${s.week}</button>`+heading(esc(s.workout),`WEEK ${s.week} / ${s.block}`)+`<div class="row"><span class="badge">${s.day} ${dateFor(s)} · ${esc(s.time)}</span><span class="muted">${esc(s.note)}</span></div><div class="spacer"></div><div class="fields"><label>สถานะ<select data-field="status">${opts(statuses,r.status)}</select></label>${field('เวลาฝึกจริง (นาที)','minutes',r.minutes)}</div>`;
 if(s.kind==='เวท'){
  app.innerHTML+=`<p class="muted section">น้ำหนักดัมเบล = kg ต่อข้าง • Pull-up บันทึกจำนวนครั้งจริง; ระบุการช่วยในหมายเหตุ • เป้าจากไฟล์แนบแก้ได้ตามวิดีโอ</p>`;
  let groups=[];for(const set of s.sets){let g=groups[groups.length-1];if(!g||g.name!==set.name||g.group!==set.group){g={name:set.name,group:set.group,sets:[]};groups.push(g)}g.sets.push(set)}
  app.innerHTML+=groups.map(g=>`<section class="exercise"><div class="exhead"><h3>${esc(g.name)}</h3><span class="badge">${esc(g.group)}</span></div><div class="setlist">${g.sets.map((set,i)=>{const v=r.sets?.[set.id]||{};return `<div class="setrow ${v.done?'finished':''}" id="set-${set.id}"><div class="set-top"><span class="setno">เซ็ต ${i+1}</span><label class="done-toggle"><input aria-label="${esc(g.name)} เซ็ต ${i+1} ทำเสร็จ" type="checkbox" data-set="${set.id}" data-key="done" ${v.done?'checked':''}><span>ทำแล้ว</span></label></div><details class="target-edit"><summary><span>เป้า <span data-target-label="${set.id}">${esc(v.target??set.target)}</span></span></summary><label>แก้เป้าตามวิดีโอ<input aria-label="${esc(g.name)} เซ็ต ${i+1} เป้าหมาย" data-set="${set.id}" data-key="target" value="${esc(v.target??set.target)}" enterkeyhint="done"></label></details><div class="set-fields"><label>น้ำหนัก / ข้าง (kg)<input aria-label="${esc(g.name)} เซ็ต ${i+1} น้ำหนัก" type="number" min="0" step="any" inputmode="decimal" enterkeyhint="next" data-set="${set.id}" data-key="kg" value="${esc(v.kg)}" placeholder="—"></label><label>ครั้ง / วินาทีจริง<input aria-label="${esc(g.name)} เซ็ต ${i+1} ผลจริง" inputmode="decimal" enterkeyhint="done" data-set="${set.id}" data-key="actual" value="${esc(v.actual)}" placeholder="—"></label></div></div>`}).join('')}</div></section>`).join('');
 }else if(s.kind.startsWith('Cardio')){app.innerHTML+=`<div class="panel section"><div class="fields"><label>รูปแบบ<select data-field="activity">${opts(['','เดินเร็ว','เดินชัน','วิ่งเบา','ปั่นจักรยาน','อื่น ๆ'],r.activity||'')}</select></label>${field('ระยะทาง (km)','distance',r.distance)}${field('HR เฉลี่ย (bpm)','hr',r.hr)}${field('ความเหนื่อย RPE 1–10','rpe',r.rpe,'number','max="10"')}</div><p class="muted section">ใช้ความหนักที่ยังพูดเป็นประโยคได้ ถ้าขาล้าเลือกเดินเบาหรือพัก</p></div>`}

function renderProgress(){const completed=PLAN.filter(s=>s.kind==='เวท'&&read(s).status==='ทำแล้ว').length;app.innerHTML=heading('ความคืบหน้า','PROGRESS')+`<div class="split"><div class="panel"><h2>เวทที่ทำแล้ว ${completed} / 52</h2><div class="progress"><div style="width:${completed/52*100}%"></div></div><p class="muted section">สถานะ “ทำแล้ว” เป็นตัวนับ session<br>ช่องเซ็ตใช้บันทึกแยก ไม่เปลี่ยนสถานะวันโดยอัตโนมัติ</p></div><div class="panel"><h2>แนวโน้มน้ำหนักเฉลี่ย</h2><div id="chart"></div></div></div><div class="weekhead"><h2>บันทึกร่างกาย</h2>${weekControls()}</div><div class="panel"><div class="fields metric-fields">${metricField('น้ำหนักเฉลี่ย (kg)','weight')}${metricField('รอบเอว (cm)','waist')}${metricField('Pull-up strict สูงสุด (ครั้ง)','pullup')}</div><label class="section">การฟื้นตัว / หมายเหตุ<textarea data-metric="note" rows="2">${esc(state.metrics[state.week]?.note)}</textarea></label></div><h2 class="section" style="margin-bottom:14px">สรุปแต่ละสัปดาห์</h2><div class="weekly-reports" id="weeklyReports">${reportCards()}</div>`;drawChart()}
function reportCards(){return Array.from({length:13},(_,i)=>{const w=i+1,ss=PLAN.filter(s=>s.week===w),m=state.metrics[w]||{};return `<section class="panel report-card"><header><h3>สัปดาห์ ${w}</h3><span class="badge">${block(w)}</span></header><dl><div><dt>เวทเสร็จ</dt><dd>${ss.filter(s=>s.kind==='เวท'&&read(s).status==='ทำแล้ว').length} / 4 วัน</dd></div><div><dt>Cardio</dt><dd>${ss.filter(s=>s.kind.startsWith('Cardio')).reduce((n,s)=>n+(Number(read(s).minutes)||0),0)} นาที</dd></div><div><dt>น้ำหนักเฉลี่ย</dt><dd>${m.weight?esc(m.weight)+' kg':'—'}</dd></div><div><dt>รอบเอว</dt><dd>${m.waist?esc(m.waist)+' cm':'—'}</dd></div></dl></section>`}).join('')}
function metricField(label,k){return `<label>${label}<input type="number" min="0" step="any" inputmode="decimal" enterkeyhint="next" data-metric="${k}" value="${esc(state.metrics[state.week]?.[k])}"></label>`}
function drawChart(){const el=document.getElementById('chart');if(!el)return;const points=Array.from({length:13},(_,i)=>({w:i+1,n:Number(state.metrics[i+1]?.weight)})).filter(x=>Number.isFinite(x.n)&&x.n>0);if(!points.length){el.innerHTML='<p class="empty">กรอกน้ำหนักรายสัปดาห์เพื่อแสดงกราฟ</p>';return}const lo=Math.min(...points.map(x=>x.n))-1,hi=Math.max(...points.map(x=>x.n))+1;const xy=p=>[40+(p.w-1)*25,150-(p.n-lo)/(hi-lo)*120];el.innerHTML=`<svg class="chart" viewBox="0 0 370 185" role="img" aria-label="กราฟน้ำหนักเฉลี่ยรายสัปดาห์"><path d="M40 25V150H350" fill="none" stroke="#526276"/><text x="5" y="30" fill="#aab8c8" font-size="12">${hi.toFixed(1)}</text><text x="5" y="150" fill="#aab8c8" font-size="12">${lo.toFixed(1)}</text><polyline points="${points.map(p=>xy(p).join(',')).join(' ')}" fill="none" stroke="#bafa49" stroke-width="3"/>${points.map(p=>{const [x,y]=xy(p);return `<circle cx="${x}" cy="${y}" r="4" fill="#bafa49"><title>สัปดาห์ ${p.w}: ${p.n} kg</title></circle>`}).join('')}<text x="40" y="175" fill="#aab8c8" font-size="12">W1</text><text x="320" y="175" fill="#aab8c8" font-size="12">W13</text></svg>`}
function renderSettings(){app.innerHTML=heading('ตั้งค่า & สำรองข้อมูล','LOCAL / OFFLINE')+`<div class="split"><section class="panel"><h2>วันเริ่มโปรแกรม</h2><label class="section">เลือกวันจันทร์<input id="startDate" type="date" min="2000-01-01" max="2100-12-31" value="${esc(state.start)}"></label><p class="muted section">เปลี่ยนวันเริ่มจะเลื่อนวันที่ทั้งหมด โดยเก็บบันทึกตามหมายเลขสัปดาห์เดิม</p></section><section class="panel"><h2>สำรองข้อมูล</h2><p class="muted section">ดาวน์โหลด JSON เก็บไว้เป็นระยะ ใช้นำเข้าบนเครื่องหรือเบราว์เซอร์อื่นได้</p><div class="actions section"><button class="primary" id="export">ส่งออกข้อมูล</button><button id="import">นำเข้า JSON</button></div></section></div><section class="panel section instructions"><h2>ใช้งานบน iPhone</h2><p>เปิดผ่าน Safari จากคอมพิวเตอร์ที่อยู่ใน Wi-Fi เดียวกัน คอมพิวเตอร์ต้องเปิดแอปเซิร์ฟเวอร์ไว้ระหว่างใช้งาน โทรศัพท์บันทึกข้อมูลของตัวเอง ไม่ซิงก์กับคอมพิวเตอร์</p><ol><li>บนคอมพิวเตอร์ที่มี Python: วาง HTML ในโฟลเดอร์แยก เปิด Terminal ในโฟลเดอร์นั้น แล้วรัน <code>python -m http.server 8000 --bind 0.0.0.0</code></li><li>บน Windows ใช้ <code>ipconfig</code> ดู IPv4 ของ Wi-Fi แล้วเปิด Safari ไปที่ <code>http://IP-คอมพิวเตอร์:8000/Body_Beast_Local.html</code> เช่น <code>http://192.168.1.20:8000/Body_Beast_Local.html</code> หาก Firewall ถาม ให้อนุญาตเฉพาะเครือข่ายส่วนตัว</li><li>ตั้งวันเริ่ม เลือกสัปดาห์ และเปิดวันฝึกเพื่อกรอกน้ำหนักกับจำนวนครั้ง</li><li>ติ๊กเซ็ตที่ทำเสร็จ และกด “จบการฝึก” เพื่อสรุป session</li><li>ส่งออก JSON ก่อนย้ายไฟล์ ล้างข้อมูลเบราว์เซอร์ หรือเปลี่ยนเครื่อง</li></ol><p>เปิดบนคอมพิวเตอร์โดยตรงได้ด้วย Chrome หรือ Edge ส่วนบน iPhone ให้ใช้ URL ใน Safari แทนหน้า Preview ของแอป Files ใช้ IP และพอร์ตเดิมเพื่อเข้าถึงข้อมูลชุดเดิม หาก IP เปลี่ยนให้ย้ายด้วย JSON</p><p>ข้อมูลอยู่ใน localStorage ของเบราว์เซอร์นี้ ไม่มีการส่งข้อมูลออกหรือซิงก์ข้ามเครื่อง การเปิดไฟล์แบบ file:// อาจจัดเก็บแยกตามที่อยู่ไฟล์และเบราว์เซอร์ ควรใช้ตำแหน่งเดิมและหลีกเลี่ยงโหมดไม่ระบุตัวตน</p><details><summary>หากเปิดไฟล์แล้วบันทึกไม่ได้</summary><p>หากติดตั้ง Python ให้เปิด Terminal ในโฟลเดอร์ไฟล์ แล้วรัน <code>python -m http.server 8000 --bind 127.0.0.1</code> จากนั้นเปิด <code>http://localhost:8000/Body_Beast_Local.html</code> และใช้ URL/พอร์ตเดิมทุกครั้ง ข้อมูลของ file:// กับ localhost แยกกัน ให้ย้ายด้วย JSON</p></details><h3 class="section">เกี่ยวกับแผน</h3><p>ฉบับดัดแปลง 13 สัปดาห์: Build 1–3, Bulk 4–9, Beast 10–13 เวท 4 วันต่อสัปดาห์ มีจำนวน session น้อยกว่าตาราง HUGE เดิม กล้ามเนื้อหลักส่วนใหญ่ฝึกเฉพาะกลุ่มสัปดาห์ละหนึ่งครั้ง</p><p>จันทร์–อังคารฝึกเย็น / พุธ cardio เช้า / ศุกร์พัก / พฤหัส–เสาร์เลือกเวลาสะดวก / อาทิตย์ optional</p><p>ลำดับท่าและเซ็ตนำจากไฟล์ Body Beast ที่แนบ บางแถวต้นฉบับอาจพิมพ์ซ้ำหรือระบุเวลาไม่ชัด ให้ตรวจเทียบวิดีโอและแก้ช่องเป้าได้ EZ bar เป็นอุปกรณ์เสริม ให้ใช้ตัวเลือกดัมเบลตามวิดีโอ</p><p>Pull-up มีในวันหลังแล้ว ไม่ต้องเพิ่มซ้ำ ใช้ assisted ตามกำลัง หากฟอร์มเสียให้หยุดหรือลดน้ำหนัก และลดแขนเสริมเมื่อฟื้นตัวไม่ทัน</p><p class="muted">แหล่งแผน: Body_Beast_13_Weeks_4_Days_Tracker.xlsx จากบทสนทนานี้ · ข้อมูลโปรแกรม: <a href="https://www.bodi.com/products/body-beast" target="_blank" rel="noopener noreferrer">BODi Body Beast</a></p></section>`}
function setWeek(w){state.week=Math.max(1,Math.min(13,w));selected=null;save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;selected=null;render();window.scrollTo(0,0);return}if(b.dataset.session){selected=b.dataset.session;render();window.scrollTo(0,0);return}switch(b.id){case'back':selected=null;render();break;case'prevWeek':setWeek(state.week-1);break;case'nextWeek':setWeek(state.week+1);break;case'nextSet':{const next=app.querySelector('.setrow:not(.finished)');if(next)next.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});else toast('ติ๊กครบทุกเซ็ตแล้ว');break}case'complete':{const s=PLAN.find(x=>x.id===selected),r=record(s);if(r.status!=='ทำแล้ว'){r.status=s.kind==='พัก'?'พัก':'ทำแล้ว';const ok=save();toast(ok?'บันทึกการฝึกวันนี้แล้ว':'บันทึกชั่วคราว • กรุณาส่งออกข้อมูล')}selected=null;render();window.scrollTo(0,0);break}case'export':download();break;case'import':document.getElementById('importFile').click();break}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.set!==undefined){const s=PLAN.find(x=>x.id===selected),r=record(s),v=r.sets[el.dataset.set]||(r.sets[el.dataset.set]={});if(el.type==='number'&&!el.checkValidity())return;v[el.dataset.key]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.key==='done')el.closest('.setrow')?.classList.toggle('finished',el.checked);if(el.dataset.key==='target'){const label=app.querySelector('[data-target-label="'+el.dataset.set+'"]');if(label)label.textContent=el.value;}save();const c=document.getElementById('setCount');if(c)c.textContent=s.sets.filter(x=>r.sets[x.id]?.done).length+' / '+s.sets.length+' เซ็ตที่ติ๊กเสร็จ';}else if(el.dataset.field){if(el.type==='number'&&!el.checkValidity())return;const s=PLAN.find(x=>x.id===selected);record(s)[el.dataset.field]=el.value;save();}else if(el.dataset.metric){if(el.type==='number'&&!el.checkValidity())return;(state.metrics[state.week]||(state.metrics[state.week]={}))[el.dataset.metric]=el.value;save();drawChart();}});
document.addEventListener('change',e=>{if(e.target.id==='weekSelect')setWeek(Number(e.target.value));if(e.target.id==='startDate'){const v=e.target.value;if(v&&(!validDate(v)||new Date(v+'T12:00:00').getDay()!==1)){toast('กรุณาเลือกวันจันทร์');e.target.value=state.start;return}state.start=v;save();toast('อัปเดตวันเริ่มแล้ว')}if(e.target.dataset.metric){const reports=document.getElementById('weeklyReports');if(reports)reports.innerHTML=reportCards()}});
function download(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Body_Beast_Backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('ส่งออกข้อมูลสำรองแล้ว')}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('ไฟล์ใหญ่เกิน 10 MB');const candidate=cleanImport(JSON.parse(await f.text()));if(!confirm('นำเข้าแล้วจะแทนที่ข้อมูลในแอปนี้ทั้งหมด ต้องการดำเนินการหรือไม่?'))return;state=candidate;loadBlocked=false;const ok=save();if(ok)document.getElementById('storageAlert').innerHTML='';selected=null;render();toast(ok?'นำเข้าข้อมูลแล้ว':'นำเข้าในหน้านี้แล้ว แต่ยังบันทึกถาวรไม่ได้');}catch(err){toast('นำเข้าไม่สำเร็จ: '+err.message)}finally{e.target.value=''}});
window.addEventListener('storage',e=>{if(e.key===KEY)document.getElementById('storageAlert').innerHTML='<div class="banner">ข้อมูลมีการเปลี่ยนในอีกแท็บ กรุณาปิดแท็บนี้แล้วเปิดใหม่ก่อนบันทึกต่อ เพื่อป้องกันข้อมูลทับกัน</div>';if(e.key===KEY)loadBlocked=true;});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_training_week',title:'อ่านตารางฝึกประจำสัปดาห์',description:'Read the local Body Beast plan and completion status for a week. Does not modify data.',inputSchema:{type:'object',properties:{week:{type:'integer',minimum:1,maximum:13}},required:['week'],additionalProperties:false},annotations:{readOnlyHint:true},execute:({week})=>{if(!Number.isInteger(week)||week<1||week>13)throw Error('week must be 1–13');return PLAN.filter(s=>s.week===week).map(s=>({day:s.day,workout:s.workout,time:s.time,status:read(s).status}));}})).catch(()=>{});}catch{}}
function syncKeyboard(){const el=document.activeElement,editing=el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName),vv=window.visualViewport;document.body.classList.toggle('keyboard-open',Boolean(editing&&vv&&innerHeight-vv.height>130));}
window.visualViewport?.addEventListener('resize',syncKeyboard);document.addEventListener('focusin',syncKeyboard);document.addEventListener('focusout',()=>setTimeout(syncKeyboard,120));
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;const el=e.target;if(el.dataset.key==='kg'){e.preventDefault();el.closest('.setrow')?.querySelector('[data-key="actual"]')?.focus();}else if(el.dataset.key||el.dataset.field||el.dataset.metric){e.preventDefault();el.blur();}});
render();
